name: TradeFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tradeflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit and Testcontainers integration tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  frontend:
    name: Angular verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.15.1
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Angular tests
        run: pnpm frontend:test
      - name: Build production Angular bundle
        run: pnpm frontend:build

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.15.1
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run disposable full-stack journeys
        run: pnpm e2e:stack

  images:
    name: Build and scan images
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build immutable backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: tradeflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build immutable frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: tradeflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan backend image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tradeflow-backend:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tradeflow-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Prepare immutable registry names
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker tag tradeflow-backend:${GITHUB_SHA} "${IMAGE_ROOT}/backend:${GITHUB_SHA}"
          docker tag tradeflow-frontend:${GITHUB_SHA} "${IMAGE_ROOT}/frontend:${GITHUB_SHA}"
          docker push "${IMAGE_ROOT}/backend:${GITHUB_SHA}"
          docker push "${IMAGE_ROOT}/frontend:${GITHUB_SHA}"
